project:
  name: "wind-turbine-predictive-maintenance"
  version: "1.0.0"
  environment: "development"

wind_farm:
  num_turbines: 5
  turbine_ids: ["WTG-001", "WTG-002", "WTG-003", "WTG-004", "WTG-005"]
  sampling_interval_seconds: 10
  data_retention_days: 365

sensors:
  bearing_temp:
    unit: "celsius"
    normal_range: [20, 75]
    warning_threshold: 80
    critical_threshold: 95
  vibration:
    unit: "mm/s"
    normal_range: [0.1, 4.5]
    warning_threshold: 7.0
    critical_threshold: 10.0
  rotor_speed:
    unit: "rpm"
    normal_range: [5, 15]
    warning_threshold: 17
    critical_threshold: 20
  oil_pressure:
    unit: "bar"
    normal_range: [2.5, 6.0]
    warning_threshold: 2.0
    critical_threshold: 1.5
  generator_temp:
    unit: "celsius"
    normal_range: [40, 90]
    warning_threshold: 95
    critical_threshold: 110
  power_output:
    unit: "kW"
    normal_range: [100, 2000]
    warning_threshold: 50
    critical_threshold: 20
  wind_speed:
    unit: "m/s"
    normal_range: [3, 25]
    warning_threshold: 28
    critical_threshold: 30

faults:
  types:
    - "bearing_failure"
    - "gearbox_fault"
    - "generator_overheating"
    - "blade_imbalance"
    - "oil_leak"
    - "electrical_fault"
    - "normal"
  fault_probability: 0.15

data_generation:
  days: 90
  output_dir: "data/raw"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

models:
  anomaly_detection:
    isolation_forest:
      contamination: 0.08
      n_estimators: 200
      random_state: 42
    lstm_autoencoder:
      sequence_length: 48
      encoding_dim: 32
      epochs: 50
      batch_size: 64
      threshold_percentile: 95
  fault_classification:
    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      random_state: 42
  rul_prediction:
    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05
      random_state: 42

risk_scoring:
  weights:
    anomaly_score: 0.30
    fault_probability: 0.40
    rul_score: 0.30
  thresholds:
    low: 0.30
    medium: 0.55
    high: 0.75
    critical: 0.90

database:
  pool_size: 10
  max_overflow: 20

api:
  host: "0.0.0.0"
  port: 8000
  reload: true

agents:
  llm_provider: "groq"
  model_name: "llama3-8b-8192"
  temperature: 0.1
  max_tokens: 2048
  vector_db: "chromadb"
